<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | E-Waste</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f8f5;color:#172a22;font-family:Segoe UI,Arial,sans-serif;padding:20px}.card{width:min(420px,100%);background:white;border:1px solid #e1eee6;border-radius:20px;padding:32px;box-shadow:0 14px 40px #184e3212}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#2fa873;color:white;font-size:27px;margin-bottom:20px}h1{margin:0 0 8px;font-size:26px}p{color:#718078;font-size:14px;line-height:1.5}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #dce7df;border-radius:10px;font-size:15px}.btn{width:100%;border:0;border-radius:10px;background:#2fa873;color:#fff;padding:13px;font-weight:700;font-size:15px;cursor:pointer}.btn:hover{background:#176b4a}.msg{min-height:20px;color:#c0392b;font-size:13px;margin-top:12px}.back{display:block;text-align:center;margin-top:20px;color:#176b4a;font-size:13px}</style></head>
<body><main class="card"><div class="logo">♻</div><h1>Admin sign in</h1><p>Sign in to manage collection requests, user records and dashboard analytics.</p><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Sign in securely</button><div class="msg" id="message" role="status"></div></form><a class="back" href="/">← Back to public collection page</a></main>
<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('message');msg.textContent='Signing in…';try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href=d.redirect||'/admin'}catch(err){msg.textContent=err.message}});</script></body></html>
